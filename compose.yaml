services:
  notebook:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      RUN_FROZEN_DEBERTA: "1"
      RUN_DEBERTA_FINETUNING: "1"
      RUN_QWEN_ZERO_SHOT: "1"
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.token=
      - --ServerApp.password=
