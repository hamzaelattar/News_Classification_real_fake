[project]
name = "news-classification"
version = "0.1.0"
description = "Classification reproductible d'articles Fake/Real"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=6.29,<7",
    "joblib>=1.4,<2",
    "jupyterlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
transformers = [
    "accelerate>=1.0,<2",
    "sentencepiece>=0.2,<1",
    "torch>=2.4,<3",
    "transformers>=4.45,<5",
]

[dependency-groups]
dev = [
    "nbclient>=0.10,<1",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/news_classification"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["artifacts", "tp01-llm (2).ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
